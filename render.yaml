services:
  - type: web
    name: hoanlink-v4
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADDLIVETAG_API_KEY
        sync: false
      - key: SHOPEE_AFFILIATE_ID
        sync: false
      - key: ADMIN_KEY
        sync: false
